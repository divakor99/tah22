# P2 head + DySnakeRes in backbone (P4) + DCNv3Fast in head (P3/P4 outputs)
# Keep nc/scales/end2end/reg_max lines identical to your stock yolo26-p2.yaml.
nc: 6
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]            # 0
  - [-1, 1, Conv,  [128, 3, 2]]           # 1
  - [-1, 2, C3k2,  [256, False, 0.25]]    # 2 P2
  - [-1, 1, Conv,  [256, 3, 2]]           # 3
  - [-1, 2, C3k2,  [512, False, 0.25]]    # 4 P3
  - [-1, 1, Conv,  [512, 3, 2]]           # 5
  - [-1, 2, C3k2,  [512, True]]           # 6 P4
  - [-1, 1, DySnakeRes, [512]]            # 7 P4 (snake, residual)
  - [-1, 1, Conv,  [1024, 3, 2]]          # 8
  - [-1, 2, C3k2,  [1024, True]]          # 9
  - [-1, 1, SPPF,  [1024, 5, 3, True]]    # 10
  - [-1, 2, C2PSA, [1024]]                # 11 P5

head:
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 7], 1, Concat, [1]]                    # 13
  - [-1, 2, C3k2, [512, False]]                  # 14 P4 td
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, Concat, [1]]                    # 16
  - [-1, 2, C3k2, [256, False]]                  # 17 P3 td
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 2], 1, Concat, [1]]                    # 19
  - [-1, 2, C3k2, [128, False]]                  # 20 P2 out
  - [-1, 1, Conv, [128, 3, 2]]                   # 21
  - [[-1, 17], 1, Concat, [1]]                   # 22
  - [-1, 2, C3k2, [256, False]]                  # 23
  - [-1, 1, DCNv3Fast, [256]]                    # 24 P3 out (DCN)
  - [-1, 1, Conv, [256, 3, 2]]                   # 25
  - [[-1, 14], 1, Concat, [1]]                   # 26
  - [-1, 2, C3k2, [512, False]]                  # 27
  - [-1, 1, DCNv3Fast, [512]]                    # 28 P4 out (DCN)
  - [-1, 1, Conv, [512, 3, 2]]                   # 29
  - [[-1, 11], 1, Concat, [1]]                   # 30
  - [-1, 2, C3k2, [1024, True]]                  # 31 P5 out
  - [[20, 24, 28, 31], 1, Detect, [nc]]          # 32
