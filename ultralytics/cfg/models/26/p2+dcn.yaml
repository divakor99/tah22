# YOLO26 + P2 head + DCNv3Fast on P3/P4 (stock PAN neck, no BiFPN, no SimAM)
nc: 6
end2end: False
reg_max: 16
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]   # 2 P2
  - [-1, 1, Conv,  [256, 3, 2]]
  - [-1, 2, C3k2,  [512, False, 0.25]]   # 4 P3
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 2, C3k2,  [512, True]]          # 6 P4
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 2, C3k2,  [1024, True]]
  - [-1, 1, SPPF,  [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]               # 10 P5

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                  # 13 P4 td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                  # 16 P3 td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17
  - [[-1, 2], 1, Concat, [1]]                    # 18
  - [-1, 2, C3k2, [128, False]]                  # 19 P2 out

  - [-1, 1, Conv, [128, 3, 2]]                   # 20
  - [[-1, 16], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [256, False]]                  # 22 P3 out
  - [-1, 1, DCNv3Fast, [256]]                    # 23 DCN on P3

  - [-1, 1, Conv, [256, 3, 2]]                   # 24
  - [[-1, 13], 1, Concat, [1]]                   # 25
  - [-1, 2, C3k2, [512, False]]                  # 26 P4 out
  - [-1, 1, DCNv3Fast, [512]]                    # 27 DCN on P4

  - [-1, 1, Conv, [512, 3, 2]]                   # 28
  - [[-1, 10], 1, Concat, [1]]                   # 29
  - [-1, 2, C3k2, [1024, True]]                  # 30 P5 out

  - [[19, 23, 27, 30], 1, Detect, [nc]]          # 31