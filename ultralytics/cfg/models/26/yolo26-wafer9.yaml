# YOLO26-Wafer train-9: semiconductor wafer defect detection
#
# Matches the architecture stored inside:
#   F:\projects-20260803T230408Z-1-001\detect\train-9\weights\best.pt
#
# BiFPN out_channels = 256  (64 effective at scale 'n')
# DCNv3Fast on P3 and P4 only (no dcn_p2)

nc: 6
end2end: False
reg_max: 16
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4  <- BiFPN P2
  - [-1, 1, Conv, [256, 3, 2]] # 3
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8  <- BiFPN P3
  - [-1, 1, Conv, [512, 3, 2]] # 5
  - [-1, 2, C3k2, [512, True]] # 6-P4/16 <- BiFPN P4
  - [-1, 1, Conv, [1024, 3, 2]] # 7
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10-P5/32 <- BiFPN P5

head:
  - [[2, 4, 6, 10], 1, BiFPN, [256, 3]] # 11  out_channels=256, num_iters=3
  - [11, 1, Index, [0]] # 12  P2/4
  - [11, 1, Index, [1]] # 13  P3/8
  - [11, 1, Index, [2]] # 14  P4/16
  - [11, 1, Index, [3]] # 15  P5/32
  - [[12, 13, 14, 15], 1, Detect, [nc]] # 16
